name: Release

# Every pull request merged into main is a release. The version is the latest
# v* tag bumped by a patch, or by a minor or major when the pull request
# carries the label release:minor or release:major. The release is built from
# the merge commit with the version stamped into the binary, tagged there, and
# its notes are the pull request's title and description.
#
# A pull request closed without merging releases nothing.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

env:
  GO_VERSION: "1.27.x"

concurrency:
  # Two merges close together must not both take the same next version.
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case " $LABELS " in
            *" release:major "*) major=$((major + 1)); minor=0; patch=0 ;;
            *" release:minor "*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "previous: $latest, next: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      # No cgo anywhere (development.md), so every target cross-compiles from here.
      # admin/build is committed, so the panel is inside each binary.
      - name: build
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/gocommerce_${TAG}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/itswadesh/gocommerce/core.Version=$VERSION" \
              -o "$out" ./cmd/gocommerce
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: notes
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '## %s\n\n' "$TITLE"
            printf '%s\n\n' "$BODY"
            printf 'Pull request: #%s\n' "$NUMBER"
          } > notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "GoCommerce $TAG" \
            --notes-file notes.md
