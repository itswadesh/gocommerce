name: Release

# Push an annotated tag that matches core.Version — `git tag -a v1.1.0 -F notes.md
# && git push origin v1.1.0` — and this publishes the GitHub release: the tag's
# message as its notes, and the reference binary for each platform attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: "1.27.x"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag's annotation is the release notes; a shallow checkout has
          # the commit but not the tag object.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # A release whose binary reports another version is the one mistake a
      # tag can make that nobody notices until a bug report quotes it.
      - name: the tag is core.Version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' core/gocommerce.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core.Version $version"
            exit 1
          fi

      # No cgo anywhere (development.md), so every target cross-compiles from here.
      # admin/build is committed, so the panel is inside each binary.
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/gocommerce_${GITHUB_REF_NAME}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/gocommerce
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "GoCommerce $GITHUB_REF_NAME" --notes-from-tag --verify-tag
