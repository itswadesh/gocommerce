name: Release

# A release is a version bump on main. When core.Version names a version that
# has no release yet, this builds the reference binary for each platform and
# publishes the release — creating the v<version> tag on the commit that
# bumped it — with docs/releases/v<version>.md as its notes. Bumping the
# version without writing those notes fails the run rather than publishing a
# release that says nothing.
on:
  push:
    branches: [main]
    paths:
      - core/gocommerce.go
      - docs/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27.x"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: is there a version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' core/gocommerce.go)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "docs/releases/$tag.md" ]; then
            echo "::error::core.Version is $version but docs/releases/$tag.md is missing or empty"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # No cgo anywhere (development.md), so every target cross-compiles from here.
      # admin/build is committed, so the panel is inside each binary.
      - name: build
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/gocommerce_${TAG}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/gocommerce
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "GoCommerce $TAG" \
            --notes-file "docs/releases/$TAG.md"
