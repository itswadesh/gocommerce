name: kitcommerce-stack

# Builds examples/kitcommerce-stack from this checkout and walks one sale
# through it, when the example or what it builds from changes. compose.yaml
# holds the storefront commit, and that commit's lockfile the connector version.
on:
  pull_request:
    paths: &paths
      - examples/kitcommerce-stack/**
      - .github/workflows/kitcommerce-stack.yml
      - Dockerfile
      - scripts/engine-login.sql
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/kitcommerce-stack
    steps:
      - uses: actions/checkout@v4
      - name: secrets for this run only
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "GOCOMMERCE_ADMIN_TOKEN=$(openssl rand -hex 32)"
            echo "GOCOMMERCE_ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > .env
      - run: docker compose up -d --build --wait
      - name: smoke test from the host
        run: |
          set -a; . ./.env; set +a
          sh scripts/smoke.sh
      - name: smoke test from inside the network
        run: docker compose --profile smoke run --rm smoke
      - name: logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
