# A whole store: the engine and its database.
#
#   docker compose up --build
#
# On Dokploy this is a Compose service. Set the variables below in the panel's
# Environment tab rather than committing them — POSTGRES_PASSWORD and
# GOCOMMERCE_ADMIN_TOKEN are secrets, and the admin password is used once.

services:
  gocommerce:
    build:
      context: .
    restart: unless-stopped
    # The binary installs no module unless told to, and the panel hides every
    # screen whose module is missing, so a store started without these has no
    # B2B, Invoices, Payouts or Abandoned carts and gives no hint why. Each
    # module sits idle until it is configured, so installing them all costs
    # nothing. -import-amazon is left out: it drives a real Chrome.
    command:
      - -addr
      - 0.0.0.0:8080
      - -identity
      - -webhooks
      - -menus
      - -reviews
      - -contact
      - -newsletter
      - -resend
      - -sendgrid
      - -twilio
      - -msg91
      - -invoices
      - -cms
      - -faq
      - -wishlist
      - -gateways
      - -carriers
      - -feeds
      - -sitemaps
      - -b2b
      - serve
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gocommerce:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/gocommerce?sslmode=disable
      # The credential scripts use. A person signs in with the email and
      # password below instead; the engine accepts either on the same routes.
      GOCOMMERCE_ADMIN_TOKEN: ${GOCOMMERCE_ADMIN_TOKEN:?set GOCOMMERCE_ADMIN_TOKEN}
      # Creates the first operator, and only while there is none — so leaving
      # these set does not reset a password on every restart.
      GOCOMMERCE_ADMIN_EMAIL: ${GOCOMMERCE_ADMIN_EMAIL:-admin@example.com}
      GOCOMMERCE_ADMIN_PASSWORD: ${GOCOMMERCE_ADMIN_PASSWORD:?set GOCOMMERCE_ADMIN_PASSWORD}
    volumes:
      - media:/data/media
    ports:
      - "${PORT:-8080}:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gocommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gocommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The engine applies its migrations on boot, so it must not start against
      # a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U gocommerce -d gocommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  media:
  pgdata:
