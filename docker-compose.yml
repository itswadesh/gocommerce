# A whole store: the engine and its database.
#
#   docker compose up --build
#
# On Dokploy this is a Compose service. Set the variables below in the panel's
# Environment tab rather than committing them — POSTGRES_PASSWORD and
# GOCOMMERCE_ADMIN_TOKEN are secrets, and the admin password is used once.

services:
  gocommerce:
    build:
      context: .
    restart: unless-stopped
    # The binary installs no module unless told to, and the panel hides every
    # screen whose module is missing, so a store started without these has no
    # B2B, Invoices, Payouts or Abandoned carts and gives no hint why. Each
    # module sits idle until it is configured, so installing them all costs
    # nothing. -import-amazon is left out: it drives a real Chrome.
    command:
      - -addr
      - 0.0.0.0:8080
      - -identity
      - -webhooks
      - -menus
      - -reviews
      - -contact
      - -newsletter
      - -resend
      - -sendgrid
      - -twilio
      - -msg91
      - -invoices
      - -cms
      - -faq
      - -translations
      - -showcases
      - -wishlist
      - -gateways
      - -carriers
      - -feeds
      - -sitemaps
      - -b2b
      - -recovery
      - serve
    depends_on:
      postgres:
        condition: service_healthy
      # The engine's login must exist before the engine signs in with it.
      engine-login:
        condition: service_completed_successfully
    environment:
      # gocommerce_app, not the superuser: every store's rows share one set of
      # tables behind row-level-security policies, and a superuser passes
      # every policy (D83). The engine-login service below creates it, on a
      # fresh volume and an existing one alike.
      DATABASE_URL: postgres://gocommerce_app:${ENGINE_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}}@postgres:5432/gocommerce?sslmode=disable
      # Custom reports run arbitrary operator SQL, so they run as a separate,
      # read-only role — never the engine's own, which owns every table and could
      # terminate connections or read files off the server (D78). Leave this
      # unset and custom reports are simply disabled; saving and listing still
      # work. To turn them on, set REPORTS_DB_PASSWORD below (the postgres
      # service creates the gocommerce_reports role from it on a fresh volume)
      # and set this URL to match. For an existing database, run
      # scripts/reports-role.sql once instead.
      GOCOMMERCE_REPORTS_DATABASE_URL: ${GOCOMMERCE_REPORTS_DATABASE_URL:-}
      # The credential scripts use. A person signs in with the email and
      # password below instead; the engine accepts either on the same routes.
      GOCOMMERCE_ADMIN_TOKEN: ${GOCOMMERCE_ADMIN_TOKEN:?set GOCOMMERCE_ADMIN_TOKEN}
      # Creates the first operator, and only while there is none — so leaving
      # these set does not reset a password on every restart.
      GOCOMMERCE_ADMIN_EMAIL: ${GOCOMMERCE_ADMIN_EMAIL:-admin@example.com}
      GOCOMMERCE_ADMIN_PASSWORD: ${GOCOMMERCE_ADMIN_PASSWORD:?set GOCOMMERCE_ADMIN_PASSWORD}
      # Where the panel is reached, e.g. https://shop.example.com: the base of
      # a password-reset link. Unset, a reset email carries only a code.
      GOCOMMERCE_PANEL_URL: ${GOCOMMERCE_PANEL_URL:-}
      # 1 lets anybody make an account on the sign-in screen and open a store.
      # It stays shut until the install has email of its own (RESEND_API_KEY
      # or SENDGRID_API_KEY below), so whoever signs up can reset a password.
      GOCOMMERCE_SIGNUP: ${GOCOMMERCE_SIGNUP:-}
      # Email and SMS delivery, every one optional: a backend without its key
      # installs idle and waits for Notifications › Setup Email / Setup SMS.
      # The engine sees only what is listed here, so a key set in the host's
      # environment tab and missing from this list never reaches it.
      # DEFAULT_EMAIL_FROM_ADDRESS is the sender for Resend and SendGrid when
      # their own *_FROM is empty; it must be on a domain the provider has
      # verified. Keys entered on a store's own screens win over these.
      DEFAULT_EMAIL_FROM_ADDRESS: ${DEFAULT_EMAIL_FROM_ADDRESS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      # MSG91's dashboard calls it the authkey, so either name works.
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-${MSG91_AUTHKEY:-}}
    volumes:
      - media:/data/media
    ports:
      - "${PORT:-8080}:8080"

  # Makes sure the engine's own login exists and owns the tables, on every
  # start. Idempotent, so an existing volume — one made before the engine
  # stopped signing in as the superuser — is brought up to date without
  # anyone running a script by hand.
  engine-login:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./scripts/engine-login.sql:/opt/gocommerce/engine-login.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=gocommerce
      - --dbname=gocommerce
      - --set=ON_ERROR_STOP=1
      - --set=engine_password=${ENGINE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - --file=/opt/gocommerce/engine-login.sql

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gocommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gocommerce
      # Used only on a fresh volume, by the init script below, to create the
      # read-only custom-reports role (D78). Unset means no role and reports
      # stay disabled. It must match the password in GOCOMMERCE_REPORTS_DATABASE_URL.
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:-}
      # The engine's login (gocommerce_app). Defaults to POSTGRES_PASSWORD.
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first init of the volume, to create gocommerce_reports.
      - ./scripts/reports-role.sql:/opt/gocommerce/reports-role.sql:ro
      - ./scripts/initdb-reports-role.sh:/docker-entrypoint-initdb.d/10-reports-role.sh:ro
    healthcheck:
      # The engine applies its migrations on boot, so it must not start against
      # a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U gocommerce -d gocommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  media:
  pgdata:
